[package]
name = "randomizer"
version = "0.4.0"
authors = [
    "Kevin Marsolais <kevin@kevinmarsolais.co>",
    "Rick Fay <rickwithanh@gmail.com>",
    "Caroline Madsen <randomsalience@gmail.com>",
]
edition = "2024"
license = "GPL-2.0-or-later"

[dependencies]
byteorder = { workspace = true }
cli = { workspace = true }
game = { workspace = true }
fs_extra = { version = "1.3.0", optional = true }
jack = { workspace = true }
json_comments = "0.2.1"
lazy_static = "1.4.0"
log = { workspace = true }
macros = { workspace = true }
modinfo = { workspace = true }
queue = "0.3.2-final"
path-absolutize = { workspace = true }
pyo3 = { workspace = true, optional = true }
rand = { workspace = true }
regex = "1.10.6"
rom = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
tempfile = { version = "3.7.1", optional = true }
try-insert-ext = "0.1.0"
twox-hash = "1.6.3"

[features]
default = ["desktop"]
# Temp-dir output and recursive copy. The 3DS build writes directly to its output folder.
desktop = ["dep:tempfile", "dep:fs_extra"]
python = ["dep:pyo3", "modinfo/python"]
