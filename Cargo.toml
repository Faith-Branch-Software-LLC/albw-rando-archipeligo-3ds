[workspace]
resolver = "2"
members = ["crates/app-3ds", "crates/citro2d-sys", "crates/spike-3ds", "crates/fill-bench", "crates/block-pool", "crates/ui-core", "crates/prefill-check", "crates/ap-patch"]
exclude = ["vendor"]

[workspace.dependencies]
# Pinned by Cargo.lock. pthread-3ds uses this exact URL with no rev, and Cargo needs one ctru-sys source.
ctru-rs = { git = "https://github.com/rust3ds/ctru-rs.git" }
ctru-sys = { git = "https://github.com/rust3ds/ctru-rs.git" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
