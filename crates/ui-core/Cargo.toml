[package]
name = "ui-core"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Menu logic, settings table, and presets, with no console dependencies so tests run on a computer"
authors = ["Sebastian Neiswanger"]

[dependencies]
modinfo = { path = "../../vendor/z17-randomizer/modinfo" }
serde_json = "1"

[dev-dependencies]
randomizer = { path = "../../vendor/z17-randomizer/randomizer", default-features = false }
