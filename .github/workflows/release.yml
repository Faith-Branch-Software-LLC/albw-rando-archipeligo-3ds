# Builds the 3DS app and the "A Link Between Worlds - 3DS" apworld, and on a version tag publishes
# both in a release zip laid out like the SD card.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  randomizer-module:
    name: Randomizer module (${{ matrix.tag }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, tag: linux-x86_64 }
          - { runner: ubuntu-22.04-arm, tag: linux-aarch64 }
          - { runner: macos-15, tag: darwin-arm64 }
          - { runner: macos-15-intel, tag: darwin-x86_64 }
          - { runner: windows-latest, tag: win32-amd64 }
          - { runner: windows-11-arm, tag: win32-arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build the module
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          sh apworld/build.sh python
          ls target/apworld/stage/albw_3ds/albw3dsrandomizer/lib/
          test -d "target/apworld/stage/albw_3ds/albw3dsrandomizer/lib/${{ matrix.tag }}"
      - uses: actions/upload-artifact@v7
        with:
          name: module-${{ matrix.tag }}
          path: target/apworld/stage/albw_3ds/albw3dsrandomizer/lib/${{ matrix.tag }}/
          if-no-files-found: error

  apworld:
    name: Pack the apworld
    needs: randomizer-module
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v8
        with:
          pattern: module-*
          path: downloaded
      - name: Pack every system's module
        run: |
          mkdir -p apworld/prebuilt
          for folder in downloaded/module-*; do
            mkdir -p "apworld/prebuilt/${folder#downloaded/module-}"
            cp "$folder"/* "apworld/prebuilt/${folder#downloaded/module-}/"
          done
          APWORLD_PACK_ONLY=1 sh apworld/build.sh python
      - uses: actions/upload-artifact@v7
        with:
          name: apworld
          path: |
            target/apworld/albw_3ds.apworld
            target/apworld/version.txt
          if-no-files-found: error

  app:
    name: 3DS app
    runs-on: ubuntu-24.04
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust, cargo-3ds and clang
        run: |
          # ctru-sys makes its bindings with bindgen, which needs clang and its own headers.
          apt-get update
          apt-get install -y --no-install-recommends clang libclang-dev
          curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
          . "$HOME/.cargo/env"
          rustup toolchain install
          cargo install --locked cargo-3ds
      - name: Build
        env:
          # Tagged builds link the albw.local page to this release's apworld. Other builds link
          # to the latest release.
          ALBW_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          . "$HOME/.cargo/env"
          export PATH="/opt/devkitpro/tools/bin:/opt/devkitpro/devkitARM/bin:$PATH"
          cargo 3ds build --release -p app-3ds
      - name: Pack the CIA
        run: |
          apt-get install -y --no-install-recommends unzip
          curl -sSfLO https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.19.0/makerom-v0.19.0-ubuntu_x86_64.zip
          curl -sSfLO https://github.com/Epicpkmn11/bannertool/releases/download/v1.2.2/bannertool.zip
          unzip -q makerom-v0.19.0-ubuntu_x86_64.zip -d makerom
          unzip -q bannertool.zip -d bannertool
          chmod +x makerom/makerom bannertool/linux-x86_64/bannertool
          MAKEROM=$PWD/makerom/makerom BANNERTOOL=$PWD/bannertool/linux-x86_64/bannertool sh tools/build-cia.sh
          mkdir -p app
          cp target/armv6k-nintendo-3ds/release/albw-rando.3dsx target/cia/albw-rando.cia app/
      - uses: actions/upload-artifact@v7
        with:
          name: app
          path: app/
          if-no-files-found: error

  release:
    name: Release zip
    needs: [apworld, app]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: built
      - name: Lay out the SD card
        run: |
          mkdir -p sd/3ds/albw-rando/apworld sd/3ds/albw-rando/ap
          cp built/app/albw-rando.3dsx sd/3ds/
          cp built/apworld/albw_3ds.apworld built/apworld/version.txt sd/3ds/albw-rando/apworld/
          touch sd/3ds/albw-rando/ap/.keep
          (cd sd && zip -r ../albw-rando-sd.zip .)
          cp built/apworld/albw_3ds.apworld built/app/albw-rando.cia .
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            albw-rando-sd.zip
            albw_3ds.apworld
            albw-rando.cia
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            albw-rando-sd.zip
            albw_3ds.apworld
            albw-rando.cia
          body: |
            Extract albw-rando-sd.zip to the root of your SD card. It adds the app and the
            /3ds/albw-rando folder with the apworld that the albw.local page offers to hosts.
            To have the app on the HOME Menu, also install albw-rando.cia with FBI.

            Hosts: put albw_3ds.apworld in Archipelago/custom_worlds/. The game is
            "A Link Between Worlds - 3DS", based on randomsalience's albw-archipelago.
