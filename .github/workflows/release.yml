# Builds the parts of a release this Mac cannot make: the randomizer module for Linux and Windows,
# and the FBI QR code. tools/release-3ds.sh pushes the version tag, waits for this workflow,
# downloads what it built, builds the macOS modules, the apworld and the 3DS app on the Mac, and
# makes the release. macOS runners are left out, as they are scarce and being retired.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  randomizer-module:
    name: Randomizer module (${{ matrix.tag }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, tag: linux-x86_64 }
          - { runner: ubuntu-22.04-arm, tag: linux-aarch64 }
          - { runner: windows-latest, tag: win32-amd64 }
          - { runner: windows-11-arm, tag: win32-arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build the module
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          sh apworld/build.sh python
          ls target/apworld/stage/albw_3ds/albw3dsrandomizer/lib/
          test -d "target/apworld/stage/albw_3ds/albw3dsrandomizer/lib/${{ matrix.tag }}"
      - uses: actions/upload-artifact@v7
        with:
          name: module-${{ matrix.tag }}
          path: target/apworld/stage/albw_3ds/albw3dsrandomizer/lib/${{ matrix.tag }}/
          if-no-files-found: error

  qr-code:
    name: FBI QR code
    runs-on: ubuntu-24.04
    steps:
      - name: Make the FBI QR code
        # FBI's Remote Install scans this code and downloads this release's CIA.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qrencode
          qrencode -s 6 -m 2 -o albw-rando-qr.png \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/albw-rando.cia"
      - uses: actions/upload-artifact@v7
        with:
          name: qr-code
          path: albw-rando-qr.png
          if-no-files-found: error
